<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="1024" height="256">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #000000; stroke-width: 2.5; fill: none; }
      .line { stroke: #000000; stroke-width: 1.5; }
      .title { fill: #000000; font-family: 'Arial Black', 'Impact', 'DejaVu Sans', 'Liberation Sans', sans-serif; font-weight: 900; letter-spacing: 0.8px; }
      .mono { fill: #000000; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-weight: 400; }
      .badge-bg { fill: #000000; }
      .badge-text { fill: #ffffff; font-weight: 700; }
      .telemetry { font-weight: 600; letter-spacing: 0.2px; }
      .label { font-family: 'JetBrains Mono ExtraBold', 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-weight: 800; }
    </style>
  </defs>

  <!-- Background and Inset Border -->
  <rect class="bg" width="400" height="100" />
  <rect class="border" x="2" y="2" width="396" height="96" rx="1.5" />

  <!-- ZONE 1: TELEMETRY -->
  <rect class="badge-bg" x="2.00" y="2" width="63.72" height="27" />
  <text class="mono telemetry badge-text" x="10.25" y="19.4" font-size="10.00">ORG: IDN</text>
  <rect class="badge-bg" x="303.98" y="2" width="94.02" height="27" />
  <text class="mono telemetry badge-text" x="310.98" y="19.4" font-size="10.00">PACK: 2026.10</text>
  <text class="mono telemetry label" x="93.96" y="19.4" font-size="10.00">ELEV:</text>
  <text class="mono telemetry" x="130.32" y="19.4" font-size="10.00">1,200-1,500M</text>
  <text class="mono telemetry" x="209.09" y="19.4" font-size="10.00">|</text>
  <text class="mono telemetry label" x="221.21" y="19.4" font-size="10.00">ACID:</text>
  <text class="mono telemetry" x="257.56" y="19.4" font-size="10.00">LOW</text>

  <!-- Divider 1 -->
  <line class="line" x1="2" y1="29" x2="398" y2="29" />

  <!-- ZONE 2: TITLE (vertically centered on the label) -->
  <text class="title" x="11.15" y="56.63" font-size="25.50">SUMATERA MANDHELING</text>

  <!-- Divider 2 -->
  <line class="line" x1="2" y1="66" x2="398" y2="66" />

  <!-- ZONE 3: SPECS -->
  <text class="mono label" x="28.12" y="78" font-size="10.50">ROAST:</text>
  <text class="mono" x="71.88" y="78" font-size="10.50">MEDIUM-DARK</text>
  <text class="mono label" x="159.38" y="78" font-size="10.50">PROCESS:</text>
  <text class="mono" x="215.62" y="78" font-size="10.50">WET-HULLED (GILING BASAH)</text>
  <text class="mono label" x="37.50" y="92" font-size="10.50">PROFILE:</text>
  <text class="mono" x="93.75" y="92" font-size="10.50">EARTHY // DARK CHOCOLATE // CEDAR // HERBAL</text>
</svg>
